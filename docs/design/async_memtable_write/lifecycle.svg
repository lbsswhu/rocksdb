<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img">
<title>07  两条完成路径与错误退出</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"WenQuanYi Zen Hei","Noto Sans CJK SC","Microsoft YaHei",sans-serif} .small{font-size:15px}</style>
<rect width="1200" height="660" fill="#f8fafc"/>
<text x="35" y="43" text-anchor="start" font-size="25" font-weight="600" fill="#172b4d">07  两条完成路径与错误退出</text>
<rect x="40" y="105" width="220" height="75" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="150.0" y="135.95" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">准备 owned group</text>
<text x="150.0" y="160.95" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">引用 / 预算 / 任务节点</text>
<rect x="355" y="105" width="220" height="75" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="465.0" y="135.95" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">WAL 成功</text>
<text x="465.0" y="160.95" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">提交整组任务</text>
<rect x="680" y="105" width="220" height="75" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="790.0" y="135.95" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">worker 应用完成</text>
<text x="790.0" y="160.95" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">全部 range 已处理</text>
<path d="M260,142 L355,142" fill="none" stroke="#52647b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M575,142 L680,142" fill="none" stroke="#52647b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350" y="275" width="290" height="78" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="495.0" y="307.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">单 worker：逐组发布 P/Q</text>
<text x="495.0" y="332.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">等待者可先于清理结束</text>
<rect x="810" y="275" width="325" height="78" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="972.5" y="307.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">多 worker：先清理 payload / 引用</text>
<text x="972.5" y="332.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">再向 notifier 提交完成报告</text>
<path d="M740,180 L740,220 L495,220 L495,275" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M825,180 L970,275" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350" y="420" width="290" height="78" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="495.0" y="452.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">lease 末批量清理、归还预算</text>
<text x="495.0" y="477.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">连续推进 drain D</text>
<path d="M495,353 L495,420" fill="none" stroke="#52647b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="810" y="420" width="325" height="78" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="972.5" y="452.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">notifier 排序、补齐前缀</text>
<text x="972.5" y="477.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">发布 P/Q、退休 D、归还预算</text>
<path d="M973,353 L973,420" fill="none" stroke="#52647b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35" y="305" width="230" height="160" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="150.0" y="342.6" text-anchor="middle" font-size="16" font-weight="400" fill="#172b4d">WAL / apply 终止错误</text>
<text x="150.0" y="366.6" text-anchor="middle" font-size="16" font-weight="400" fill="#172b4d"></text>
<text x="150.0" y="390.6" text-anchor="middle" font-size="16" font-weight="400" fill="#172b4d">冻结新的 P/Q 发布</text>
<text x="150.0" y="414.6" text-anchor="middle" font-size="16" font-weight="400" fill="#172b4d">继续清理与退休</text>
<text x="150.0" y="438.6" text-anchor="middle" font-size="16" font-weight="400" fill="#172b4d">唤醒读写和容量等待者</text>
<path d="M150,180 L150,305" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="350" y="579" text-anchor="start" font-size="18" font-weight="400" fill="#172b4d">管理操作与 Close 等待 drain，不能用 P 已推进替代资源清理。</text>
<text x="350" y="614" text-anchor="start" font-size="18" font-weight="400" fill="#172b4d">多 worker 的 drain 完成前，notifier 必须保持运行。</text>
</svg>