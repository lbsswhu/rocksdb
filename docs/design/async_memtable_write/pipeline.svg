<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="775" viewBox="0 0 1200 775" role="img">
<title>04  pipelined write 与三种执行形态</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"WenQuanYi Zen Hei","Noto Sans CJK SC","Microsoft YaHei",sans-serif} .small{font-size:15px}</style>
<rect width="1200" height="775" fill="#f8fafc"/>
<text x="35" y="43" text-anchor="start" font-size="25" font-weight="600" fill="#172b4d">04  pipelined write 与三种执行形态</text>
<text x="35" y="100" text-anchor="start" font-size="17" font-weight="600" fill="#172b4d">原生 pipeline=true</text>
<text x="40" y="155" text-anchor="start" font-size="16" font-weight="400" fill="#172b4d">WAL</text>
<text x="40" y="212" text-anchor="start" font-size="16" font-weight="400" fill="#172b4d">MemTable</text>
<rect x="200" y="123" width="250" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="325.0" y="150.25" text-anchor="middle" font-size="15" font-weight="400" fill="#172b4d">WAL group G1</text>
<rect x="470" y="123" width="250" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="595.0" y="150.25" text-anchor="middle" font-size="15" font-weight="400" fill="#172b4d">WAL group G2</text>
<path d="M450,146 L450,180" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="450" y="180" width="300" height="44" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="600.0" y="207.25" text-anchor="middle" font-size="15" font-weight="400" fill="#172b4d">调用者应用 G1</text>
<rect x="750" y="180" width="350" height="44" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="925.0" y="207.25" text-anchor="middle" font-size="15" font-weight="400" fill="#172b4d">调用者应用 G2</text>
<text x="35" y="290" text-anchor="start" font-size="17" font-weight="600" fill="#172b4d">async，threads=0，pipeline=true</text>
<text x="40" y="345" text-anchor="start" font-size="16" font-weight="400" fill="#172b4d">WAL</text>
<text x="40" y="402" text-anchor="start" font-size="16" font-weight="400" fill="#172b4d">MemTable</text>
<rect x="200" y="313" width="250" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="325.0" y="340.25" text-anchor="middle" font-size="15" font-weight="400" fill="#172b4d">WAL group G1</text>
<rect x="470" y="313" width="250" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="595.0" y="340.25" text-anchor="middle" font-size="15" font-weight="400" fill="#172b4d">WAL group G2</text>
<path d="M450,336 L450,370" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="450" y="370" width="300" height="44" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="600.0" y="397.25" text-anchor="middle" font-size="15" font-weight="400" fill="#172b4d">代表节点 G1 → 原 leader 应用</text>
<rect x="750" y="370" width="350" height="44" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="925.0" y="397.25" text-anchor="middle" font-size="15" font-weight="400" fill="#172b4d">代表节点 G2 → 原 leader 应用</text>
<text x="35" y="480" text-anchor="start" font-size="17" font-weight="600" fill="#172b4d">async，threads&gt;1，pipeline 任意（threads=1 时组间顺序应用）</text>
<text x="40" y="535" text-anchor="start" font-size="16" font-weight="400" fill="#172b4d">WAL</text>
<text x="40" y="592" text-anchor="start" font-size="16" font-weight="400" fill="#172b4d">MemTable</text>
<rect x="200" y="503" width="250" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="325.0" y="530.25" text-anchor="middle" font-size="15" font-weight="400" fill="#172b4d">WAL G1 → executor</text>
<rect x="470" y="503" width="250" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="595.0" y="530.25" text-anchor="middle" font-size="15" font-weight="400" fill="#172b4d">WAL G2 → executor</text>
<path d="M450,526 L450,560" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="450" y="560" width="420" height="44" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="660.0" y="587.25" text-anchor="middle" font-size="15" font-weight="400" fill="#172b4d">worker 0 应用 G1</text>
<rect x="720" y="620" width="390" height="44" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="915.0" y="647.25" text-anchor="middle" font-size="15" font-weight="400" fill="#172b4d">worker 1 应用 G2</text>
<path d="M720,547 L720,553 L1125,553 L1125,615 L920,615 L920,620" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="35" y="728" text-anchor="start" font-size="17" font-weight="400" fill="#172b4d">时间向右 →    每组先完成 WAL 再应用；下一组 WAL 与前组应用重叠。</text>
<text x="35" y="757" text-anchor="start" font-size="17" font-weight="400" fill="#172b4d">有池时不再进入原生 MemTable writer 队列；多 worker 的应用区间可以重叠。</text>
</svg>