<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img">
<title>01  整体架构：生产、应用、发布与通知</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"WenQuanYi Zen Hei","Noto Sans CJK SC","Microsoft YaHei",sans-serif} .small{font-size:15px}</style>
<rect width="1200" height="700" fill="#f8fafc"/>
<text x="35" y="43" text-anchor="start" font-size="25" font-weight="600" fill="#172b4d">01  整体架构：生产、应用、发布与通知</text>
<rect x="40" y="95" width="240" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="160.0" y="131.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">前台 Writer / WriteGroup</text>
<text x="160.0" y="156.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">WAL 队列形成逻辑单生产者</text>
<rect x="360" y="95" width="320" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="520.0" y="131.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">WAL 前准备 owned group</text>
<text x="520.0" y="156.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">校验 / 合并 / 引用 / 预算 / 节点</text>
<rect x="790" y="95" width="340" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="960.0" y="131.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">写 WAL / 按需 Sync</text>
<text x="960.0" y="156.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">成功后提交任务，交接 WAL gate</text>
<path d="M280,138 L360,138" fill="none" stroke="#52647b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M680,138 L790,138" fill="none" stroke="#52647b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="790" y="245" width="340" height="75" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="960.0" y="275.95" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">AsyncCommitQueue</text>
<text x="960.0" y="300.95" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">整组任务；只传 shared_ptr</text>
<path d="M960,181 L960,245" fill="none" stroke="#52647b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610" y="390" width="235" height="88" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="727.5" y="427.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">worker 0</text>
<text x="727.5" y="452.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">逐 range 应用一个完整组</text>
<rect x="900" y="390" width="235" height="88" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="1017.5" y="427.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">worker 1…N−1</text>
<text x="1017.5" y="452.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">与其他 group 并发</text>
<path d="M900,320 L900,350 L728,350 L728,390" fill="none" stroke="#52647b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M1020,320 L1020,390" fill="none" stroke="#52647b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="355" y="565" width="490" height="84" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="600.0" y="600.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">多 worker：SequenceNotifier</text>
<text x="600.0" y="625.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">清理完成报告 → 按 group id 排序 → 连续发布 P/D</text>
<path d="M728,478 L728,565" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M1020,478 L1020,607 L845,607" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="390" width="290" height="88" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="185.0" y="427.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">读 / 强可见性写等待者</text>
<text x="185.0" y="452.45" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">固定目标 T，等待 P ≥ T</text>
<path d="M355,607 L185,607 L185,478" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="185" y="560" text-anchor="middle" font-size="16" font-weight="400" fill="#b45309">通知覆盖区间的等待槽</text>
<rect x="40" y="245" width="460" height="75" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="270.0" y="275.95" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">单 worker 特例：worker 自己逐组发布 P</text>
<text x="270.0" y="300.95" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">notifier 仅负责等待槽通知</text>
<text x="43" y="681" text-anchor="start" font-size="17" font-weight="400" fill="#172b4d">三个边界：WAL 确认 ≠ sequence 发布 ≠ 资源 drain；均不等于 SST flush。</text>
</svg>