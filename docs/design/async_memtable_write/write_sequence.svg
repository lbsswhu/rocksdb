<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="795" viewBox="0 0 1200 795" role="img">
<title>02  多 worker 写入时序与两种返回边界</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"WenQuanYi Zen Hei","Noto Sans CJK SC","Microsoft YaHei",sans-serif} .small{font-size:15px}</style>
<rect width="1200" height="795" fill="#f8fafc"/>
<text x="35" y="43" text-anchor="start" font-size="25" font-weight="600" fill="#172b4d">02  多 worker 写入时序与两种返回边界</text>
<rect x="5" y="80" width="220" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="115.0" y="109.95" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">调用者 / leader</text>
<path d="M115,130 L115,735" fill="none" stroke="#52647b" stroke-width="1.8" stroke-dasharray="7 5"/>
<rect x="285" y="80" width="220" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="395.0" y="109.95" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">WAL / executor queue</text>
<path d="M395,130 L395,735" fill="none" stroke="#52647b" stroke-width="1.8" stroke-dasharray="7 5"/>
<rect x="605" y="80" width="220" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="715.0" y="109.95" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">MemTable worker</text>
<path d="M715,130 L715,735" fill="none" stroke="#52647b" stroke-width="1.8" stroke-dasharray="7 5"/>
<rect x="940" y="80" width="220" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="1050.0" y="109.95" text-anchor="middle" font-size="17" font-weight="400" fill="#172b4d">notifier</text>
<path d="M1050,130 L1050,735" fill="none" stroke="#52647b" stroke-width="1.8" stroke-dasharray="7 5"/>
<path d="M115,180 L395,180" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="255.0" y="168" text-anchor="middle" font-size="15" font-weight="400" fill="#2563eb">WAL 前准备 owned group / 任务节点</text>
<path d="M395,245 L470,245 L470,275 L395,275" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="495" y="233" text-anchor="start" font-size="15" font-weight="400" fill="#2563eb">分配 sequence，更新 A；写 WAL / Sync</text>
<path d="M395,310 L715,310" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="555.0" y="298" text-anchor="middle" font-size="15" font-weight="400" fill="#2563eb">WAL 成功，整组入队；WakeOne</text>
<path d="M395,375 L115,375" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="255.0" y="363" text-anchor="middle" font-size="15" font-weight="400" fill="#2563eb">释放 WAL gate / 通知调用者</text>
<path d="M715,455 L790,455 L790,485 L715,485" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="697" y="443" text-anchor="end" font-size="15" font-weight="400" fill="#0f766e">应用整组全部 range，清理 payload / 引用</text>
<path d="M715,520 L1050,520" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="882.5" y="508" text-anchor="middle" font-size="15" font-weight="400" fill="#0f766e">CAS 提交完成报告；所有权转移</text>
<path d="M1050,585 L1125,585 L1125,615 L1050,615" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1032" y="573" text-anchor="end" font-size="15" font-weight="400" fill="#b45309">补齐连续前缀，发布 P，推进 D</text>
<path d="M1050,675 L115,675" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="582.5" y="663" text-anchor="middle" font-size="15" font-weight="400" fill="#b45309">通知等待槽，P ≥ 目标则结束等待</text>
<rect x="15" y="396" width="235" height="65" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="132.5" y="422.1" text-anchor="middle" font-size="16" font-weight="400" fill="#172b4d">lazy=true 可返回</text>
<text x="132.5" y="446.1" text-anchor="middle" font-size="16" font-weight="400" fill="#172b4d">无需等待 worker 完成</text>
<rect x="15" y="700" width="235" height="65" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="132.5" y="726.1" text-anchor="middle" font-size="16" font-weight="400" fill="#172b4d">lazy=false 发布后返回</text>
<text x="132.5" y="750.1" text-anchor="middle" font-size="16" font-weight="400" fill="#172b4d">等待发生在 WAL gate 外</text>
<text x="450" y="768" text-anchor="start" font-size="16" font-weight="400" fill="#172b4d">单 worker：worker 逐组发布 P，批量清理后再推进 D。</text>
</svg>